{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Вход</h3>
            </div>

            <div class="card-body">

                <form method="post">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <button class="btn btn-primary w-100">
                        Войти
                    </button>

                </form>

            </div>

        </div>

    </div>
</div>

{% endblock %}
