{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Активный Сыктывкар{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet">
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">  

    <link rel="stylesheet"
    href="{% static 'css/style.css' %}">

</head>


<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand" href="/">
            Активный Сыктывкар
        </a>

        <div class="navbar-nav ms-auto d-flex flex-row align-items-center gap-2">

            <a class="btn" href="{% url 'initiative_list' %}">
                Инициативы
            </a>

            {% if user.is_authenticated %}

                 <a
                    class="btn"
                 href="{% url 'profile' %}">

                    {{ user.username }}

                </a>

                <a class="btn" href="{% url 'logout' %}">
                    Выйти
                </a>

            {% else %}

                <a class="btn" href="{% url 'login' %}">
                    Войти
                </a>

                <a class="btn" href="{% url 'register' %}">
                    Регистрация
                </a>

            {% endif %}

        </div>

    </div>

</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
