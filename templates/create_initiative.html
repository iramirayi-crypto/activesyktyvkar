{% extends "base.html" %}

{% block title %}
Создать инициативу
{% endblock %}

{% block content %}

<div class="container mt-5">

<h2>Создать инициативу</h2>

<form method="post">

    {% csrf_token %}

    <div class="mb-3">
        <label>Название</label>
        <input 
            type="text" 
            name="title" 
            class="form-control"
            required>
    </div>

    <div class="mb-3">
        <label>Описание</label>
        <textarea 
            name="description"
            class="form-control"
            required></textarea>
    </div>

    <button class="btn btn-success">
        Создать
    </button>

</form>

</div>

{% endblock %}
