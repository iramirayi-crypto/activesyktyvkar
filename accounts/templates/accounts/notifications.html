{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h2 class="mb-4">
        Уведомления
    </h2>

    {% if notifications %}

        {% for notification in notifications %}

            <div class="card mb-3">
                <div class="card-body">

                    <p class="mb-1">
                        {{ notification.message }}
                    </p>

                    <small class="text-muted">
                        {{ notification.created_at|date:"d.m.Y H:i" }}
                    </small>

                </div>
            </div>

        {% endfor %}

    {% else %}

        <p class="text-muted">
            У вас пока нет уведомлений.
        </p>

    {% endif %}

</div>

{% endblock %}
